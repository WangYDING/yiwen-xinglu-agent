[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xuanyi-npc"
version = "0.1.0"
description = "异闻行录：可审计的人机协作游戏 NPC / Human-Agent cooperative game NPC system for auditable supernatural case investigation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "WangYDING", email = "w17630630069@163.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "CONTENT_RIGHTS.md", "THIRD_PARTY_NOTICES.md"]
keywords = [
    "agent",
    "game-ai",
    "mcp",
    "npc",
    "event-sourcing",
    "deterministic-rules",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "httpx>=0.27,<1",
    "mcp==2.0.0",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
xuanyi-case-demo = "xuanyi_npc.demo_case:main"
xuanyi-deepseek-models = "xuanyi_npc.agents.deepseek_cli:model_discovery_main"
xuanyi-mcp-stdio = "xuanyi_npc.mcp_server.stdio:main"
xuanyi-play = "xuanyi_npc.cli.play:main"
xuanyi-m5-acceptance = "xuanyi_npc.evaluation.m5_acceptance:main"
xuanyi-clinic = "xuanyi_npc.clinic.server:main"
yiwen-xinglu = "xuanyi_npc.clinic.server:main"
xuanyi-product-acceptance = "xuanyi_npc.evaluation.product_acceptance:main"
xuanyi-real-mentor-pilot = "xuanyi_npc.evaluation.real_mentor_pilot:main"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=7.4,<9",
    "wheel>=0.45,<1",
]
local-embedding = [
    "numpy==2.4.6",
    "safetensors==0.8.0",
    "sentence-transformers==5.7.0",
    "torch==2.12.1",
    "transformers==4.57.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"xuanyi_npc.resources" = [
    "campaign/*.json",
    "cases/*.json",
    "pilot/*.json",
    "progression/*.json",
    "mentor/*.json",
    "curriculum/*.json",
    "exams/*.json",
    "permissions/*.json",
    "inheritance/*.json",
    "clinic/*.json",
    "clinic/*.css",
    "clinic/*.js",
    "release/*.json",
    "acceptance/*.json",
    "presentation/*.json",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
