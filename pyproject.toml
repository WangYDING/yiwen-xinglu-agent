[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xuanyi-npc"
version = "0.1.0"
description = "Deterministic domain core for a Daoist-fantasy mentor NPC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp==2.0.0",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
xuanyi-case-demo = "xuanyi_npc.demo_case:main"
xuanyi-dev-eval = "xuanyi_npc.evaluation.dev_runner:main"
xuanyi-pilot-replay = "xuanyi_npc.evaluation.pilot_runner:main"
xuanyi-deepseek-models = "xuanyi_npc.agents.deepseek_cli:model_discovery_main"
xuanyi-deepseek-pilot = "xuanyi_npc.agents.deepseek_cli:paid_pilot_main"
xuanyi-mcp-stdio = "xuanyi_npc.mcp_server.stdio:main"
xuanyi-memory-eval = "xuanyi_npc.evaluation.memory_runner:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
]
local-embedding = [
    "numpy==2.4.6",
    "safetensors==0.8.0",
    "sentence-transformers==5.7.0",
    "torch==2.12.1",
    "transformers==4.57.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
