<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="350" viewBox="0 0 1280 350" role="img" aria-labelledby="title desc">
  <title id="title">三病例确定性 Campaign 连续性</title>
  <desc id="desc">旧纸伞解锁契物归属知识并触发灰灶反应；灰灶解锁交接顺序知识并触发月井反应。推荐顺序不锁关。</desc>
  <metadata>copyright=2026 WangYDING</metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
    <style>
      .case { fill:#fff7ed; stroke:#c2410c; stroke-width:2; rx:14; }
      .fact { fill:#f5f3ff; stroke:#7c3aed; stroke-width:2; rx:14; }
      .title { font:700 19px system-ui, sans-serif; fill:#0f172a; text-anchor:middle; }
      .small { font:14px system-ui, sans-serif; fill:#475569; text-anchor:middle; }
      .arrow { stroke:#7c3aed; stroke-width:2.5; marker-end:url(#arrow); fill:none; }
    </style>
  </defs>
  <rect width="1280" height="350" fill="#ffffff"/>
  <text x="640" y="40" class="title" style="font-size:24px">三案可独立开始；箭头表示推荐与公开历史反应，不是锁关</text>
  <rect class="case" x="30" y="110" width="190" height="95"/><text class="title" x="125" y="147">旧纸伞</text><text class="small" x="125" y="177">契约与物证</text>
  <rect class="fact" x="270" y="110" width="190" height="95"/><text class="title" x="365" y="143">契物归属知识</text><text class="small" x="365" y="173">公开、可重放</text>
  <rect class="case" x="510" y="110" width="190" height="95"/><text class="title" x="605" y="147">灰灶客栈</text><text class="small" x="605" y="177">前案历史反应</text>
  <rect class="fact" x="750" y="110" width="190" height="95"/><text class="title" x="845" y="143">交接顺序知识</text><text class="small" x="845" y="173">公开、可重放</text>
  <rect class="case" x="990" y="110" width="250" height="95"/><text class="title" x="1115" y="147">月井回声</text><text class="small" x="1115" y="177">前案历史反应</text>
  <path class="arrow" d="M220 158 H270"/><path class="arrow" d="M460 158 H510"/><path class="arrow" d="M700 158 H750"/><path class="arrow" d="M940 158 H990"/>
  <text x="640" y="270" class="small" style="font-size:16px">连续性由已提交 CampaignEvent 投影；不依赖 BGE，不改变病例答案或评分</text>
  <text x="640" y="304" class="small">两个玩家的知识、推荐、历史反应和存档严格隔离</text>
</svg>
