  <text x="38" y="104" class="terminal">M5 离线纵向切片验收：通过</text><text x="38" y="131" class="terminal">- 三病例：均为 8 个连续事件，resolved / 100</text><text x="38" y="158" class="terminal">- 跨案连续性：Campaign 事件 1–3，两项公开知识已解锁</text><text x="38" y="185" class="terminal">- 恢复与隔离：独立子进程恢复、双玩家隔离、拒绝零写入均通过</text><text x="38" y="212" class="terminal">- semantic shadow：record-only 不影响请求、行动或状态</text><text x="38" y="239" class="terminal">- 外部调用：0；费用：0 CNY</text>
