  <text x="38" y="104" class="terminal">行动模式：fake（离线演示 Agent）</text><text x="38" y="131" class="terminal">语义 shadow：关闭</text><text x="38" y="158" class="terminal">本模式无需 API Key。</text><text x="38" y="185" class="terminal"></text><text x="38" y="212" class="terminal">病例公开结果</text><text x="38" y="239" class="terminal">状态：completed</text><text x="38" y="266" class="terminal">结局：resolved</text><text x="38" y="293" class="terminal">得分：100</text><text x="38" y="320" class="terminal"></text><text x="38" y="347" class="terminal">玩家历程</text><text x="38" y="374" class="terminal">已完成病例：</text><text x="38" y="401" class="terminal">- 旧纸伞与失约书生｜结局：resolved｜得分：100</text><text x="38" y="428" class="terminal">已解锁知识：</text><text x="38" y="455" class="terminal">- 你已掌握：遇到契约类异常时，先核对契物归属和承诺来源。</text><text x="38" y="482" class="terminal">推荐下一案：灰灶客栈与无火炊烟</text><text x="38" y="509" class="terminal"></text><text x="38" y="536" class="terminal">历程反应：道医记得你在旧纸伞案中核对过契物来源，提醒你本案也可留意灶契归属。</text><text x="38" y="563" class="terminal">调查建议：可在公开前置满足后优先核对灶契，但不会自动执行或发现线索。</text>
</svg>
