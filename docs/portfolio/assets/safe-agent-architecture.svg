<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">异闻行录 Human-Agent Cooperative Game NPC 架构</title>
  <desc id="desc">玩家通过 PlayerContribution 影响 GameNPCAgent；Agent 基于公开观察、目标、计划与受限记忆形成提议，确定性系统验证后由 CaseEngine 修改世界状态，再进行计划评估、重规划、反思与经验沉淀。</desc>
  <metadata>copyright=2026 WangYDING</metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <style>
      .box { fill:#f0fdfa; stroke:#0f766e; stroke-width:2; rx:14; }
      .agent { fill:#eef2ff; stroke:#4338ca; stroke-width:2.5; rx:14; }
      .gate { fill:#fff7ed; stroke:#c2410c; stroke-width:2; rx:14; }
      .state { fill:#fefce8; stroke:#a16207; stroke-width:2; rx:14; }
      .retained { fill:#f8fafc; stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; rx:14; }
      .label { font:700 18px system-ui, sans-serif; fill:#0f172a; text-anchor:middle; }
      .small { font:14px system-ui, sans-serif; fill:#334155; text-anchor:middle; }
      .note { font:600 16px system-ui, sans-serif; fill:#0f172a; text-anchor:middle; }
      .arrow { stroke:#0f766e; stroke-width:2.5; marker-end:url(#arrow); fill:none; }
    </style>
  </defs>
  <rect width="1440" height="920" fill="#ffffff"/>
  <text x="720" y="42" class="label" style="font-size:26px">异闻行录 · Human-Agent Cooperative Game NPC System</text>
  <text x="720" y="72" class="note">LLM proposes · Deterministic system validates · CaseEngine owns world-state changes</text>

  <rect class="box" x="60" y="120" width="210" height="78"/><text class="label" x="165" y="151">Player</text><text class="small" x="165" y="177">线索 · 质疑 · 建议 · 授权</text>
  <rect class="box" x="330" y="120" width="240" height="78"/><text class="label" x="450" y="151">PlayerContribution</text><text class="small" x="450" y="177">影响决策，不直接执行 Tool</text>
  <rect class="box" x="630" y="120" width="240" height="78"/><text class="label" x="750" y="151">CooperativeRuntime</text><text class="small" x="750" y="177">合作回合编排</text>
  <path class="arrow" d="M270 159 H330"/><path class="arrow" d="M570 159 H630"/>

  <rect class="box" x="410" y="250" width="680" height="82"/><text class="label" x="750" y="280">Public Observation + Goal / Plan + scoped Memory</text><text class="small" x="750" y="307">当前 Observation 优先；历史不能注入指令或扩大权限</text>
  <path class="arrow" d="M750 198 V250"/>

  <rect class="agent" x="500" y="382" width="500" height="92"/><text class="label" x="750" y="415">GameNPCAgent proposal</text><text class="small" x="750" y="443">当前 cooperative main Agent · 形成调查意图与候选行动</text>
  <path class="arrow" d="M750 332 V382"/>

  <rect class="box" x="590" y="524" width="320" height="76"/><text class="label" x="750" y="555">Cooperative Decision</text><text class="small" x="750" y="580">接受 / 部分接受 / 拒绝 / 替代</text>
  <path class="arrow" d="M750 474 V524"/>

  <rect class="gate" x="80" y="650" width="250" height="90"/><text class="label" x="205" y="682">PublicActionContract</text><text class="small" x="205" y="708">Tool · target · arguments</text>
  <rect class="gate" x="390" y="650" width="250" height="90"/><text class="label" x="515" y="682">GoalPlanPolicy</text><text class="small" x="515" y="708">Goal / Plan / target 对齐</text>
  <rect class="gate" x="700" y="650" width="250" height="90"/><text class="label" x="825" y="682">Authority Policy</text><text class="small" x="825" y="708">调查 · 协商 · 高风险确认</text>
  <path class="arrow" d="M750 600 V625 H205 V650"/><path class="arrow" d="M750 600 V625 H515 V650"/><path class="arrow" d="M750 600 V650"/>

  <rect class="box" x="1010" y="650" width="150" height="90"/><text class="label" x="1085" y="684">Tool</text><text class="small" x="1085" y="711">每回合最多一个</text>
  <rect class="state" x="1220" y="650" width="170" height="90"/><text class="label" x="1305" y="684">CaseEngine</text><text class="small" x="1305" y="711">世界状态权威</text>
  <path class="arrow" d="M950 695 H1010"/><path class="arrow" d="M1160 695 H1220"/>

  <rect class="box" x="960" y="800" width="270" height="76"/><text class="label" x="1095" y="831">Plan Evaluation / Replanning</text><text class="small" x="1095" y="856">依据已提交结果调整计划</text>
  <rect class="box" x="630" y="800" width="260" height="76"/><text class="label" x="760" y="831">Reflection</text><text class="small" x="760" y="856">evidence-grounded candidate</text>
  <rect class="box" x="300" y="800" width="260" height="76"/><text class="label" x="430" y="831">Experience Consolidation</text><text class="small" x="430" y="856">验证后保守写入 Memory</text>
  <path class="arrow" d="M1305 740 V780 H1095 V800"/><path class="arrow" d="M960 838 H890"/><path class="arrow" d="M630 838 H560"/>

  <rect class="retained" x="1040" y="250" width="330" height="170"/><text class="label" x="1205" y="285">Retained / Historical</text><text class="small" x="1205" y="318">MentorAgent</text><text class="small" x="1205" y="343">Teaching / Presentation Branch</text><text class="small" x="1205" y="376">DoctorAgent</text><text class="small" x="1205" y="401">V0 Baseline</text>
  <text x="1205" y="453" class="small">普通案中人物不是 Agent · This is not Multi-Agent</text>
</svg>
